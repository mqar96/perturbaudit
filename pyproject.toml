[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbaudit"
version = "0.2.1"
description = "Internal-control falsification and edge-level false discovery for causal gene networks inferred from Perturb-seq"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Muhammad Qudduse Ahmad Rao"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "h5py>=3.8", "anndata>=0.9"]

[project.scripts]
perturbaudit = "perturbaudit.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["mkdocs>=1.5"]
examples = ["scikit-learn>=1.3", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
