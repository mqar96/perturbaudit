name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Source tests
        run: |
          pip install -e .[test]
          pytest -q
      - name: Installed-wheel tests (outside the checkout)
        run: |
          pip install build
          python -m build --wheel
          pip uninstall -y perturbaudit
          pip install dist/*.whl
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import perturbaudit, sys; assert 'site-packages' in perturbaudit.__file__, perturbaudit.__file__"
          pytest -q tests
